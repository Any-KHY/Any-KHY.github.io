    L380,208 L388,242 L396,208 L404,242
    L412,225 C430,225 445,225 465,225
    L475,212 L483,238 L491,212 L499,238
    L507,225 C525,225 540,225 560,225
    L570,210 L578,240 L586,210 L594,240
    L602,225 C625,225 645,225 760,225"
    fill="none" stroke="url(#wave-g2)" stroke-width="1.5"/>

  <!-- Main EEG waveform -->
  <path d="M40,225
