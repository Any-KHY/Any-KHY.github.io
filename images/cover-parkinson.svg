  <!-- Data-point markers on peaks -->
  <circle cx="112" cy="175" r="3.5" fill="#90b0ff" opacity="0.8"/>
  <circle cx="278" cy="165" r="3.5" fill="#90b0ff" opacity="0.8"/>
  <circle cx="458" cy="168" r="3.5" fill="#90b0ff" opacity="0.8"/>
