<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1228"/>
      <stop offset="100%" stop-color="#060818"/>
    </linearGradient>
    <linearGradient id="wave-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4060cc" stop-opacity="0.3"/>
      <stop offset="30%"  stop-color="#6080ff" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#90b0ff" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#6080ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4060cc" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wave-g2" x1="0" y1="0" x2="1" y2="0">
