      <stop offset="50%"  stop-color="#c070ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9040bb" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-p)"/>

