<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1e0c"/>
      <stop offset="100%" stop-color="#050f06"/>
    </linearGradient>
    <linearGradient id="cyl-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4cca60"/>
      <stop offset="100%" stop-color="#2a8a3a"/>
    </linearGradient>
    <linearGradient id="cyl-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e6628"/>
      <stop offset="100%" stop-color="#0e3a14"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-m)"/>

  <!-- Subtle circuit-like grid -->
  <line x1="0"   y1="150" x2="800" y2="150" stroke="rgba(76,202,96,0.04)" stroke-width="1"/>
  <line x1="0"   y1="300" x2="800" y2="300" stroke="rgba(76,202,96,0.04)" stroke-width="1"/>
  <line x1="200" y1="0"   x2="200" y2="450" stroke="rgba(76,202,96,0.04)" stroke-width="1"/>
  <line x1="500" y1="0"   x2="500" y2="450" stroke="rgba(76,202,96,0.04)" stroke-width="1"/>

  <!-- ── Database cylinders (left cluster) ── -->

  <!-- Cylinder 3 (bottom) -->
  <ellipse cx="270" cy="340" rx="80" ry="22" fill="#0e3a14" opacity="0.9"/>
  <rect x="190" y="278" width="160" height="62" fill="url(#cyl-side)" opacity="0.9"/>
  <ellipse cx="270" cy="278" rx="80" ry="22" fill="url(#cyl-top)" opacity="0.88"/>
  <!-- shine line -->
  <ellipse cx="255" cy="274" rx="32" ry="8" fill="rgba(255,255,255,0.08)"/>

  <!-- Cylinder 2 (middle) -->
  <ellipse cx="270" cy="265" rx="80" ry="22" fill="#0e3a14" opacity="0.9"/>
  <rect x="190" y="203" width="160" height="62" fill="url(#cyl-side)" opacity="0.9"/>
  <ellipse cx="270" cy="203" rx="80" ry="22" fill="url(#cyl-top)" opacity="0.9"/>
  <ellipse cx="255" cy="199" rx="32" ry="8" fill="rgba(255,255,255,0.08)"/>

  <!-- Cylinder 1 (top) -->
  <ellipse cx="270" cy="190" rx="80" ry="22" fill="#0e3a14" opacity="0.9"/>
  <rect x="190" y="128" width="160" height="62" fill="url(#cyl-side)" opacity="0.9"/>
  <ellipse cx="270" cy="128" rx="80" ry="22" fill="url(#cyl-top)"/>
  <ellipse cx="255" cy="124" rx="32" ry="8" fill="rgba(255,255,255,0.10)"/>

  <!-- Connection lines from db to note -->
  <line x1="352" y1="200" x2="460" y2="210" stroke="rgba(76,202,96,0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="352" y1="234" x2="460" y2="240" stroke="rgba(76,202,96,0.20)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="352" y1="268" x2="460" y2="268" stroke="rgba(76,202,96,0.15)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Connector dots -->
  <circle cx="352" cy="200" r="3" fill="#4cca60" opacity="0.5"/>
  <circle cx="352" cy="234" r="3" fill="#4cca60" opacity="0.4"/>
  <circle cx="352" cy="268" r="3" fill="#4cca60" opacity="0.3"/>

  <!-- ── Musical note (right) ── -->
  <!-- Note head -->
  <ellipse cx="560" cy="295" rx="26" ry="20" fill="#4cca60" opacity="0.85" transform="rotate(-20,560,295)"/>
  <!-- Note stem -->
  <rect x="582" y="175" width="8" height="125" fill="#4cca60" opacity="0.85" rx="4"/>
  <!-- Note flag -->
  <path d="M590,175 C640,185 650,215 610,235" fill="none" stroke="#4cca60" stroke-width="8" stroke-linecap="round" opacity="0.85"/>

  <!-- Second smaller note -->
  <ellipse cx="640" cy="320" rx="20" ry="15" fill="#3aaa4e" opacity="0.6" transform="rotate(-20,640,320)"/>
  <rect x="656" y="222" width="6" height="103" fill="#3aaa4e" opacity="0.6" rx="3"/>
  <path d="M662,222 C700,230 705,254 675,268" fill="none" stroke="#3aaa4e" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Label -->
  <text x="400" y="418" text-anchor="middle"
    fill="rgba(255,255,255,0.33)"
    font-family="'Source Sans Pro', Arial, sans-serif"
    font-size="13" letter-spacing="5" font-weight="600">
    MONGODB · PYTHON · NOSQL
  </text>
</svg>
